name: cardreport-server

services:
  postgres:
    image: postgres:18.0-bookworm@sha256:3f55f8895c4ed50603e2fbdfc72fffeeaba3173321fee5cb825bbbeb30d9d854
    environment:
      POSTGRES_USER: cardreport
      POSTGRES_PASSWORD: local-db-only
      POSTGRES_DB: ${POSTGRES_DB:-cardreport}
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardreport -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    command: ["mini", "-dir=/data", "-ip=s3", "-ip.bind=0.0.0.0", "-admin.ui=false", "-webdav=false"]
    environment:
      AWS_ACCESS_KEY_ID: cardreport-local
      AWS_SECRET_ACCESS_KEY: local-storage-only
      S3_BUCKET: ${S3_BUCKET:-cardreport}
    ports: ["127.0.0.1:${S3_PORT:-18333}:8333"]
    volumes: ["s3-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9333/cluster/status"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    profiles: ["app"]
    build: .
    image: cardreport-server:local
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    environment: &app-environment
      CARDREPORT_DATABASE_URL: postgresql://cardreport:local-db-only@postgres:5432/${POSTGRES_DB:-cardreport}
      CARDREPORT_S3_ENDPOINT: http://s3:8333
      CARDREPORT_S3_ACCESS_KEY: cardreport-local
      CARDREPORT_S3_SECRET_KEY: local-storage-only
      CARDREPORT_S3_BUCKET: ${S3_BUCKET:-cardreport}
      CARDREPORT_S3_PREFIX: ${S3_PREFIX:-cardreport/}
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_healthy}

  api:
    profiles: ["app"]
    build: .
    image: cardreport-server:local
    command: ["/app/.venv/bin/python", "-m", "cardreport_server", "api", "--host", "0.0.0.0"]
    environment: *app-environment
    ports: ["127.0.0.1:${API_PORT:-18000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=10)"]
      interval: 5s
      timeout: 12s
      retries: 12
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 140s

  worker:
    profiles: ["app"]
    build: .
    image: cardreport-server:local
    command: ["/app/.venv/bin/python", "-m", "cardreport_server", "worker"]
    environment:
      <<: *app-environment
      CARDREPORT_CONTAINER: "1"
      CARDREPORT_WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_healthy}
    restart: on-failure
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "cardreport_server", "worker-health"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 30s
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 140s

volumes:
  postgres-data:
  s3-data:
