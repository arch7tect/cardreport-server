name: cardreport-server

services:
  postgres:
    image: postgres:18.0-bookworm@sha256:3f55f8895c4ed50603e2fbdfc72fffeeaba3173321fee5cb825bbbeb30d9d854
    environment:
      POSTGRES_USER: cardreport
      POSTGRES_PASSWORD: local-db-only
      POSTGRES_DB: ${POSTGRES_DB:-cardreport}
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardreport -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    command: ["mini", "-dir=/data", "-ip=s3", "-ip.bind=0.0.0.0", "-admin.ui=false", "-webdav=false"]
    environment:
      AWS_ACCESS_KEY_ID: cardreport-local
      AWS_SECRET_ACCESS_KEY: local-storage-only
      S3_BUCKET: ${CARDREPORT_S3_BUCKET:-${S3_BUCKET:-cardreport}}
    ports: ["127.0.0.1:${S3_PORT:-18333}:8333"]
    volumes: ["s3-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9333/cluster/status"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    profiles: ["app"]
    build: .
    image: cardreport-server:local
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    environment: &app-environment
      CARDREPORT_DATABASE_URL: postgresql://cardreport:local-db-only@postgres:5432/${POSTGRES_DB:-cardreport}
      CARDREPORT_S3_ENDPOINT: http://s3:8333
      CARDREPORT_S3_ACCESS_KEY: cardreport-local
      CARDREPORT_S3_SECRET_KEY: local-storage-only
      CARDREPORT_S3_BUCKET: ${CARDREPORT_S3_BUCKET:-${S3_BUCKET:-cardreport}}
      CARDREPORT_S3_PREFIX: ${CARDREPORT_S3_PREFIX:-${S3_PREFIX:-cardreport/}}
      CARDREPORT_S3_REGION: "${CARDREPORT_S3_REGION:-us-east-1}"
      CARDREPORT_DB_POOL_SIZE: "${CARDREPORT_DB_POOL_SIZE:-8}"
      CARDREPORT_IO_TIMEOUT: "${CARDREPORT_IO_TIMEOUT:-5}"
      CARDREPORT_DB_CONNECT_TIMEOUT: "${CARDREPORT_DB_CONNECT_TIMEOUT:-5}"
      CARDREPORT_DB_STATEMENT_TIMEOUT: "${CARDREPORT_DB_STATEMENT_TIMEOUT:-5}"
      CARDREPORT_DB_LOCK_TIMEOUT: "${CARDREPORT_DB_LOCK_TIMEOUT:-3}"
      CARDREPORT_INPUT_LIMIT: "${CARDREPORT_INPUT_LIMIT:-16777216}"
      CARDREPORT_DATA_MAX_ROWS: "${CARDREPORT_DATA_MAX_ROWS:-2000}"
      CARDREPORT_DATA_MAX_CELLS: "${CARDREPORT_DATA_MAX_CELLS:-100000}"
      CARDREPORT_OUTPUT_LIMIT: "${CARDREPORT_OUTPUT_LIMIT:-33554432}"
      CARDREPORT_UPLOAD_SLOTS: "${CARDREPORT_UPLOAD_SLOTS:-4}"
      CARDREPORT_UPLOAD_TIMEOUT: "${CARDREPORT_UPLOAD_TIMEOUT:-120}"
      CARDREPORT_UPLOAD_IDLE_TIMEOUT: "${CARDREPORT_UPLOAD_IDLE_TIMEOUT:-30}"
      CARDREPORT_BACKLOG_LIMIT: "${CARDREPORT_BACKLOG_LIMIT:-1000}"
      CARDREPORT_ADMISSION_ENABLED: "${CARDREPORT_ADMISSION_ENABLED:-true}"
      CARDREPORT_WORKER_CONCURRENCY: "${CARDREPORT_WORKER_CONCURRENCY:-${WORKER_CONCURRENCY:-2}}"
      CARDREPORT_LEASE_SECONDS: "${CARDREPORT_LEASE_SECONDS:-60}"
      CARDREPORT_HEARTBEAT_SECONDS: "${CARDREPORT_HEARTBEAT_SECONDS:-15}"
      CARDREPORT_ATTEMPT_TIMEOUT: "${CARDREPORT_ATTEMPT_TIMEOUT:-120}"
      CARDREPORT_RENDER_TIMEOUT: "${CARDREPORT_RENDER_TIMEOUT:-300}"
      CARDREPORT_STARTUP_RENDER_TIMEOUT: "${CARDREPORT_STARTUP_RENDER_TIMEOUT:-30}"
      CARDREPORT_STARTUP_TIMEOUT: "${CARDREPORT_STARTUP_TIMEOUT:-75}"
      CARDREPORT_HEALTH_MAX_AGE: "${CARDREPORT_HEALTH_MAX_AGE:-60}"
      CARDREPORT_CLEANUP_GRACE: "${CARDREPORT_CLEANUP_GRACE:-5}"
      CARDREPORT_SHUTDOWN_GRACE: "${CARDREPORT_SHUTDOWN_GRACE:-130}"
      CARDREPORT_MAX_ATTEMPTS: "${CARDREPORT_MAX_ATTEMPTS:-3}"
      CARDREPORT_POLL_SECONDS: "${CARDREPORT_POLL_SECONDS:-1}"
      CARDREPORT_QUEUE_MAX_AGE: "${CARDREPORT_QUEUE_MAX_AGE:-3600}"
      CARDREPORT_RETRY_DELAY: "${CARDREPORT_RETRY_DELAY:-5}"
      CARDREPORT_RETRY_MAX_DELAY: "${CARDREPORT_RETRY_MAX_DELAY:-120}"
      CARDREPORT_INPUT_RETENTION: "${CARDREPORT_INPUT_RETENTION:-3600}"
      CARDREPORT_RESULT_RETENTION: "${CARDREPORT_RESULT_RETENTION:-86400}"
      CARDREPORT_METADATA_RETENTION: "${CARDREPORT_METADATA_RETENTION:-604800}"
      CARDREPORT_DOWNLOAD_TIMEOUT: "${CARDREPORT_DOWNLOAD_TIMEOUT:-120}"
      CARDREPORT_ORPHAN_GRACE: "${CARDREPORT_ORPHAN_GRACE:-900}"
      CARDREPORT_MAINTENANCE_INTERVAL: "${CARDREPORT_MAINTENANCE_INTERVAL:-30}"
      CARDREPORT_MAINTENANCE_BATCH_SIZE: "${CARDREPORT_MAINTENANCE_BATCH_SIZE:-100}"
      CARDREPORT_TEMP_ROOT: "${CARDREPORT_TEMP_ROOT:-/tmp/cardreport-worker}"
      CARDREPORT_IMAGE_ID: "${CARDREPORT_IMAGE_ID:-development}"
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_healthy}

  api:
    profiles: ["app"]
    build: .
    image: cardreport-server:local
    command: ["/app/.venv/bin/python", "-m", "cardreport_server", "api", "--host", "0.0.0.0"]
    environment: *app-environment
    ports: ["127.0.0.1:${API_PORT:-18000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=10)"]
      interval: 5s
      timeout: 12s
      retries: 12
    mem_limit: 512m
    cpus: 1
    stop_grace_period: ${CONTAINER_STOP_GRACE:-140s}

  worker:
    profiles: ["app"]
    build: .
    image: cardreport-server:local
    command: ["/app/.venv/bin/python", "-m", "cardreport_server", "worker"]
    environment:
      <<: *app-environment
      CARDREPORT_CONTAINER: "1"
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_healthy}
    restart: on-failure
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "cardreport_server", "worker-health"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: ${WORKER_START_PERIOD:-30s}
    mem_limit: 2g
    cpus: 2
    stop_grace_period: ${CONTAINER_STOP_GRACE:-140s}

volumes:
  postgres-data:
  s3-data:
