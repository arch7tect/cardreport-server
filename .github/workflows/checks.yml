name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          python-version: "3.12"
      - id: release
        run: uv run --no-project python scripts/release.py plan
        env:
          GH_TOKEN: ${{ github.token }}
  verify:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_VERSION: ${{ needs.plan.outputs.version }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/check_docs.py
      - run: uv run pytest tests/unit -q
      - run: uv run python scripts/check_package.py
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/test_integration.py --containers --ui
      - run: docker run --rm cardreport-server:local /app/.venv/bin/python -m cardreport_server smoke
      - name: Save the tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.plan.outputs.release == 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm -e EXPECTED_VERSION="$BUILD_VERSION" cardreport-server:local /app/.venv/bin/python -c 'import os; from importlib.metadata import version; assert version("cardreport-server") == os.environ["EXPECTED_VERSION"]'
          docker tag cardreport-server:local "cardreport-server:release-$ARCH"
          docker save "cardreport-server:release-$ARCH" | gzip -1 > "local/$ARCH.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.plan.outputs.release == 'true'
        with:
          name: tested-image-${{ matrix.arch }}
          path: local/${{ matrix.arch }}.tar.gz
          overwrite: true
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-evidence-${{ matrix.arch }}
          path: |
            local/cardreport-test-*/compose.log
            local/cardreport-test-*/ui-*
          retention-days: 7
  publish:
    needs: [plan, verify]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: cardreport-server-release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: tested-image-*
          path: local/release-images
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified images and GitHub release
        run: uv run --no-project python scripts/release.py publish
        env:
          GH_TOKEN: ${{ github.token }}
