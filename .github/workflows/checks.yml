name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/check_docs.py
      - run: uv run pytest tests/unit -q
      - run: uv run python scripts/test_integration.py --containers
      - run: docker run --rm cardreport-server:local /app/.venv/bin/python -m cardreport_server smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-evidence
          path: local/cardreport-test-*/compose.log
          retention-days: 7
