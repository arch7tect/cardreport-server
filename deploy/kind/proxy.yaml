apiVersion: v1
kind: ConfigMap
metadata:
  name: cardreport-proxy
data:
  nginx.conf: "events {}\nhttp {\n  access_log off;\n  server {\n    listen 8080;\n\
    \    client_max_body_size 16m;\n    client_body_timeout 150s;\n    location /\
    \ {\n      proxy_pass http://cardreport-api:8000;\n      proxy_http_version 1.1;\n\
    \      proxy_request_buffering off;\n      proxy_buffering off;\n      proxy_read_timeout\
    \ 150s;\n      proxy_send_timeout 150s;\n    }\n  }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardreport-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cardreport-proxy
  template:
    metadata:
      labels:
        app: cardreport-proxy
        cardreport-client: 'true'
    spec:
      automountServiceAccountToken: false
      containers:
      - name: proxy
        image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
      volumes:
      - name: config
        configMap:
          name: cardreport-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: cardreport-proxy
spec:
  selector:
    app: cardreport-proxy
  ports:
  - port: 8080
