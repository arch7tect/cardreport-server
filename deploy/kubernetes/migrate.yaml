apiVersion: batch/v1
kind: Job
metadata:
  name: cardreport-migrate
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
      - name: migrate
        image: cardreport-server:local
        imagePullPolicy: IfNotPresent
        args:
        - /app/.venv/bin/alembic
        - upgrade
        - head
        envFrom:
        - configMapRef:
            name: cardreport-config
        - secretRef:
            name: cardreport-secrets
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
